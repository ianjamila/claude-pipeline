# .claude/pipeline.yml — project settings for the global ship/verify pipeline.
# Validate with: node ~/.claude/pipeline/bin/pipeline.mjs config
version: 1
project: my-app
default_branch: main
enforcement: github            # github = branch protection must be live; gate = skills only
# owner_approval: label        # label (default) = the owner adds `human-approved` / `test-change-approved` to let a blocking hard-stop
#                              # or test-integrity violation merge. chat = no labels: CI does not fail on those, the ship skill
#                              # stops before the merge, lists them in a PR comment and `pipeline merge` merges when the owner says "merge" in chat.
#                              # chat also never labels a PR `needs-human`: a stop is a PR comment, a phone push and a `Stopped #N · stop <id>` line that only
#                              # the owner's own `ship resume N` / "merge" releases (leftover labels are ignored); agents never merge by hand there.
#                              # Switch a repo to chat only after `pipeline update` on EVERY machine that can merge it.
worktree_dir: .worktrees       # ship creates agent/<name> worktrees here (must be gitignored)
# worktrees:                 # `pipeline worktrees prune` (spec docs/specs/2026-10-13-worktree-prune-design.md)
#   mode: report             # off | report | on — nothing is removed until this says on
#   protect: [foundation, "*.stack"]
#   min_idle_hours: 24
#   min_merged_hours: 24

verify:
  full: node scripts/verify.mjs          # everything; must pass before a PR and at the final gate
  quick: node scripts/verify.mjs --quick # fast subset; the Stop hook runs this
  report: .verify/report.json
  screenshots: .verify/screenshots
  # expected_steps: [install, typecheck, lint, unit, build]   # optional: final-gate then requires the report's steps to
  #                                # equal this list exactly (in order), not the list the report declares for itself
  # skippable_steps: [db]          # optional: steps verify may skip (report status "skipped" + a reason, e.g. a slow db step
  #                                # when nothing it depends on changed). final-gate refuses a skipped step not listed here;
  #                                # absent = no step may be skipped. Every name must also be in expected_steps (when set).
  # stop_queue_wait_minutes: 5   # optional, integer 0..30, default 0: minutes verify.quick may WAIT (e.g. for a machine-wide
  #                                # heavy-check slot) before it runs. The Stop hook adds this to its 840 s execution allowance, so
  #                                # raise the hook's "timeout" in .claude/settings.json to 900 + minutes * 60 seconds (5 -> 1200);
  #                                # `P config` warns when it is lower.
  # after_fix: quick            # optional, full (default) | quick: what the verifier runs after review fixes are accepted. quick = verify.quick,
  #                                # plus verify.full --only <steps> when the fixes touch a path below (`P verify plan-after-fix --round R`
  #                                # prints the commands). The first full verify and the final gate's verify stay full.
  # after_fix_steps_by_path:       # optional: glob -> steps to add (`verify.full --only a,b`) when the round's fixes touch a match
  #   "supabase/**": [db, db-grants]
  # after_fix_never: [sql-arms]    # optional: steps that must stay full-verify only; one listed in the map above is a config error
  # max_parallel_full: 2        # optional, positive integer: at most this many FULL verifies (of any repo) run at once on this machine; the
  #                                # rest wait in arrival order. The ship skill then runs `P verify slot --run` (which runs verify.full itself). Unset = no limit.
  # max_load: 12                # optional, positive number, needs max_parallel_full: after getting a slot, wait while the 1-minute load
  #                                # average is above this (re-checked every 5-30 s), then run anyway with a warning. Not on Windows.
  # max_load_wait_minutes: 10   # optional, default 10, at most 10: how long that load wait may last
  # deferrable_steps: [sql-arms]   # optional: steps whose local run a GitHub Actions run may replace at the final gate (verify.mjs --defer <step>
  #                                # reports them skipped with skipKind "ci"). Needs ci_proof below. The gate reads these settings from the BASE branch.
  # ci_proof:                      # optional: for each deferrable step, the workflow FILE and job that vouch for it (never matched by check name alone)
  #   sql-arms: { workflow: .github/workflows/migration-replay.yml, job: "SQL arms", event: pull_request }   # job: one aggregator job for a sharded matrix
  # ci_proof_inputs: ["supabase/tests/sql-arms/**"]   # optional: extra paths that make a PR ineligible (.github/**, .claude/pipeline.yml, scripts/verify* always do)
  # ci_proof_wait_minutes: 20      # optional, above 0: the most ship waits for that run before running the step on the Mac (unset = no waiting)

ci:
  required_checks: ["Test integrity", "Hard-stop scan"]   # + your CI job names
  e2e_label: null              # label that triggers CI E2E for high-risk PRs, if any
  draft_while_iterating: false
  # guard_checks: true         # default true: preflight and `protect` ALWAYS require the "Test integrity" and "Hard-stop scan"
  #                            # statuses on top of required_checks. Set false only for a repo that does not run
  #                            # pipeline-guards.yml (then list its real checks in required_checks).
  # approvers: [your-login]    # GitHub logins whose `human-approved` / `test-change-approved` labels count. Empty = the repo
  #                            # owner of a USER-owned repo. REQUIRED when the repo belongs to an organization: without it
  #                            # every approval fails closed (reason org-repo-needs-ci.approvers).

merge:
  # {pr} = PR number, {sha} = approved head SHA (the merge must refuse any other head).
  command: gh pr merge {pr} --squash --auto --delete-branch --match-head-commit {sha}
  wait_minutes: 15

preview: null
#  provider: github-deployments
#  environment: Preview
#  smoke: node scripts/pipeline/smoke.mjs --base {url}

production: null
#  url: https://example.com
#  provider: vercel
#  environment: Production
#  deploy_timeout_minutes: 20
#  watch: session               # session (default): ship runs prod-watch (smoke + rollback). workflow: a CI workflow of yours
#                               # owns the production smoke and posts `<!-- prod-smoke-result v=1 … -->` comments (as
#                               # github-actions[bot]) on the merged PR; ship never runs prod-watch or rolls back, and
#                               # `pipeline agent-log close` copies those results into the agent log.
#  smoke: node scripts/pipeline/smoke.mjs --base {url} --production
#  rollback:                    # required by validation, but `command` is documentation for humans only:
#    command: vercel rollback <known-good-deployment> --yes   # what prod-watch runs for provider "vercel": see below
#    notes: After a rollback Vercel stops auto-assigning production domains until you promote a deployment.
#  # prod-watch never executes rollback.command. For provider "vercel" it runs the Vercel CLI itself, from the
#  # linked project checkout: `vercel rollback <known-good> --yes --timeout 3m`, where <known-good> is the deployment
#  # production served just before the merge (`pipeline merge` records it in .review/prod-before.json). For provider
#  # "other" nothing is automatic: it opens a needs-human issue and prints rollback.command for a person to run.

smoke_checks: []               # GET-only, unauthenticated: [{path: /, status: [200], contains: ["…"]}]

risk:
  high_risk_paths: []
  medium_lines: 150
  high_lines: 600
  medium_files: 10

hard_stops:                    # project extras on top of the universal list
  paths: []
  patterns: []                 # [{name: ..., regex: ..., paths: ["**/*.ts"]}]
  auth_calls: []               # authorization helpers whose removal is a hard-stop
  disable_rules: []            # built-in rules to switch off; only R6-sensitive (e.g. an HR/payroll app)
  report_only_rules: []        # rules still found + listed but never blocking, no label needed: R1-data-write,
                               # R2-auth, R2-auth-removed, R3-secrets, R4-config (CLAUDE.md, local hooks...), R5-major-dep, R6-sensitive,
                               # P-pattern (database rules and R4-pipeline, the guard core, always block)
  report_only_paths: []        # globs like `paths` whose match is listed but never blocking (a path in both lists blocks)

review:
  codex_model: gpt-6-astra
  effort: {low: medium, medium: medium, high: high, followup: medium}
  max_rounds: 3
  light_lane_max_lines: 50

agent_log: docs/agent-log.md   # one line per run; kept on the orphan branch `pipeline-agent-log` (`pipeline agent-log publish`), never committed to a PR branch
