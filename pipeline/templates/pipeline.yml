# .claude/pipeline.yml — project settings for the global review/verify pipeline.
# Validate with: node ~/.claude/pipeline/bin/pipeline.mjs config
version: 1
project: my-app
default_branch: main            # must equal GitHub's default branch (what origin/HEAD names): preflight reports a mismatch and the merge gate refuses it
enforcement: github            # github = branch protection must be live; gate = skills only
# owner_approval: label        # label (default) = the owner adds `human-approved` / `test-change-approved` to let a blocking hard-stop
#                              # or test-integrity violation merge. chat = no labels: CI does not fail on those, the review skill
#                              # stops before the merge, lists them in a PR comment and merges when the owner says "merge" in chat.
# owner_go:                   # click-to-approve (needs owner_approval: chat; the owner runs `pipeline owner-go approve-dialog-hooks` once)
#   click: on                # on (default) = the review skill may offer "merge" / "extra round" / rulings as a click on a choice dialog (typing still works);
#                            # off = typed words only
worktree_dir: .worktrees       # the review skill creates agent/<name> worktrees here (must be gitignored)
# worktrees:                 # `pipeline worktrees prune` (spec docs/specs/2026-10-13-worktree-prune-design.md)
#   mode: report             # off | report | on — nothing is removed until this says on
#   protect: [foundation, "*.stack"]
#   min_idle_hours: 24
#   min_merged_hours: 24

verify:
  full: node scripts/verify.mjs          # everything; must pass before a PR and at the final gate
  quick: node scripts/verify.mjs --quick # fast subset for quick checks while you work
  report: .verify/report.json
  screenshots: .verify/screenshots
  # expected_steps: [install, typecheck, lint, unit, build]   # optional: final-gate then requires the report's steps to
  #                                # equal this list exactly (in order), not the list the report declares for itself
  # skippable_steps: [db]          # optional: steps verify may skip (report status "skipped" + a reason, e.g. a slow db step
  #                                # when nothing it depends on changed). final-gate refuses a skipped step not listed here;
  #                                # absent = no step may be skipped. Every name must also be in expected_steps (when set).
  # stop_queue_wait_minutes: 0   # retired with the Stop hook (stop-verify); still accepted (integer 0..30) so an older config validates, but nothing reads it.
  # after_fix: quick            # optional, full (default) | quick: what the verifier runs after review fixes are accepted. quick = verify.quick,
  #                                # plus verify.full --only <steps> when the fixes touch a path below (`P verify plan-after-fix --round R`
  #                                # prints the commands). The first full verify and the final gate's verify stay full.
  # after_fix_steps_by_path:       # optional: glob -> steps to add (`verify.full --only a,b`) when the round's fixes touch a match
  #   "supabase/**": [db, db-grants]
  # after_fix_never: [sql-arms]    # optional: steps that must stay full-verify only; one listed in the map above is a config error
  # max_parallel_full: 2        # optional, positive integer: at most this many FULL verifies (of any repo) run at once on this machine; the
  #                                # rest wait in arrival order. The review skill then runs `P verify slot --run` (which runs verify.full itself). Unset = no limit.
  # max_load: 12                # optional, positive number, needs max_parallel_full: after getting a slot, wait while the 1-minute load
  #                                # average is above this (re-checked every 5-30 s), then run anyway with a warning. Not on Windows.
  # max_load_wait_minutes: 10   # optional, default 10, at most 10: how long that load wait may last
  # deferrable_steps: [sql-arms]   # optional: steps whose local run a GitHub Actions run may replace at the final gate (verify.mjs --defer <step>
  #                                # reports them skipped with skipKind "ci"). Needs ci_proof below. The gate reads these settings from the BASE branch.
  # ci_proof:                      # optional: for each deferrable step, the workflow FILE and job that vouch for it (never matched by check name alone)
  #   sql-arms: { workflow: .github/workflows/migration-replay.yml, job: "SQL arms", event: pull_request }   # job: one aggregator job for a sharded matrix
  #   # optional per entry: steps: ["Typecheck", "Vitest"]   # step names inside the job that must each have run and succeeded (a job with a docs-only skip is green with every step skipped)
  # ci_proof_inputs: ["supabase/tests/sql-arms/**"]   # optional: extra paths that make a PR ineligible (.github/**, .claude/pipeline.yml, scripts/verify* always do)
  # ci_proof_wait_minutes: 20      # optional, above 0: the most the review skill waits for that run before running the step on the Mac (unset = no waiting)

ci:
  required_checks: ["Test integrity", "Hard-stop scan"]   # + your CI job names
  e2e_label: null              # label that triggers CI E2E for high-risk PRs, if any
  draft_while_iterating: false # true: before a fix push to a READY PR, `pipeline redraft` turns it back to draft so CI waits and
  #                            # runs once, when review is complete and the PR is marked ready. The starter templates
  #                            # (verify.yml, pipeline-guards.yml) already meet this rule, so a repo whose
  #                            # heavy required CI is these may set true; any other required workflow must (a) skip drafts, (b) list
  #                            # `ready_for_review` AND `converted_to_draft` in its pull_request types (a bare `pull_request:` has
  #                            # neither) and (c) share one concurrency group per PR with cancel-in-progress.
  #                            # false: a fix push only releases the merge hold.
  # guard_checks: true         # default true: preflight and `protect` ALWAYS require the "Test integrity" and "Hard-stop scan"
  #                            # statuses on top of required_checks. Set false only for a repo that does not run
  #                            # pipeline-guards.yml (then list its real checks in required_checks).
  # review_check: false        # true: pipeline-guards.yml also posts "Cross-model review" (success only when the latest
  #                            # review-complete comment's content hash is the PR head's), and preflight, `protect` and the
  #                            # final gate require it. Turn it on together with branch protection that requires it.
  # approvers: [your-login]    # GitHub logins whose `human-approved` / `test-change-approved` labels count. Empty = the repo
  #                            # owner of a USER-owned repo. REQUIRED when the repo belongs to an organization: without it
  #                            # every approval fails closed (reason org-repo-needs-ci.approvers).

merge:
  # {pr} = PR number, {sha} = approved head SHA (the merge must refuse any other head).
  command: gh pr merge {pr} --squash --auto --delete-branch --match-head-commit {sha}
  wait_minutes: 15
  # Optional merge-hold seam for a repo whose merge command keeps a cooperative merge lock (all three or none; {pr} required in each,
  # {reason} required in the release command, {sha} not allowed). The check must be read-only and differ from the other two; its last
  # stdout line is {"pr":N,"blockedBy":[{"number":A,"title":"...","since":"<ISO>","expires":"<ISO>"}]}. Enforcement is cooperative; add the
  # keys only after a pipeline version that knows them is installed, remove them first to roll back. A PR whose hold expires and is renewed
  # goes to the back of the queue: the owner's exits are merging the PR ahead, the provider's --release, or its --ignore-hold.
  # hold_command: npm run merge-hold -- {pr}
  # hold_release_command: npm run merge-hold -- {pr} --release --reason {reason}
  # hold_check_command: npm run merge-hold -- --status {pr} --json
  # behind_base: update          # default. `disjoint` lets `pipeline merge --owner-go` merge a PR that lacks commits of its base when
  #                            # main's new commits touch none of the PR's files (read from the BASE branch's copy of this file only,
  #                            # never the PR's). A change to CI/toolchain files on main (.github/**, this file, scripts/verify*,
  #                            # .gitattributes, .gitmodules, .nvmrc, .node-version, .tool-versions, verify.ci_proof_inputs) always forces an update.
  # behind_base_stale_paths: []  # extra globs that force the update too, e.g. [package.json, package-lock.json, 'tsconfig*.json', 'supabase/**']

# preview and production are still validated, but the final gate and `pipeline merge` no longer read them: there is no
# deployment lookup, no preview check, no rollback target and no production watch. `pipeline smoke` reads `preview.smoke` and `production.smoke`.
preview: null
#  provider: github-deployments
#  environment: Preview
#  smoke: node scripts/pipeline/smoke.mjs --base {url}

production: null
#  url: https://example.com
#  provider: vercel
#  environment: Production
#  deploy_timeout_minutes: 20
#  watch: session               # session (default) | workflow: a CI workflow of yours owns the production smoke and posts
#                               # `<!-- prod-smoke-result v=1 … -->` comments (as github-actions[bot]) on the merged PR;
#                               # `pipeline agent-log close` copies those results into the agent log.
#  smoke: node scripts/pipeline/smoke.mjs --base {url} --production
#  rollback:                    # required by validation; `command` is documentation for humans only (nothing runs it)
#    command: vercel rollback <known-good-deployment> --yes
#    notes: After a rollback Vercel stops auto-assigning production domains until you promote a deployment.

smoke_checks: []               # GET-only, unauthenticated: [{path: /, status: [200], contains: ["…"]}]
# smoke_bypass_header: x-smoke-key   # optional, default null. NAME of one extra request header the smoke sends to the
#                              # configured (non-localhost) origin as a firewall hint, e.g. for a Vercel Firewall "Bypass"
#                              # rule that lets CI runner IPs through. Lowercase, /^x-[a-z0-9-]{1,60}$/. NOT app auth: the
#                              # smoke stays a cookie-less GET. The secret VALUE is never written here: set the environment
#                              # variable PIPELINE_SMOKE_BYPASS_KEY (e.g. from a CI secret). Without it nothing extra is sent.
# smoke_bypass_origins: ["https://www.example.com"]   # default []. REQUIRED (non-empty) when smoke_bypass_header is set:
#                              # the header goes ONLY to a base whose origin equals one of these exactly (https, no path,
#                              # no trailing slash, no wildcard). A preview URL, any other host or localhost never gets it.

risk:
  high_risk_paths: []
  medium_lines: 150
  high_lines: 600
  medium_files: 10
  # ignore_hard_stop_rules: [P-path, R4-config]   # default []. Hits of these rules stop counting toward the risk LEVEL only (they stay hits: reported, owner-merge
  #                              # items, final gate, never the light lane). ONLY P-path and R4-config are allowed. The rating also reads this file as committed at the
  #                              # default branch's fork point and the stricter of the two wins, so a PR cannot loosen its own rating.

hard_stops:                    # project extras on top of the universal list
  paths: []
  patterns: []                 # [{name: ..., regex: ..., paths: ["**/*.ts"]}]
  auth_calls: []               # authorization helpers whose removal is a hard-stop
  disable_rules: []            # built-in rules to switch off; only R6-sensitive (e.g. an HR/payroll app)
  report_only_rules: []        # rules still found + listed but never blocking, no label needed: R1-data-write,
                               # R2-auth, R2-auth-removed, R3-secrets, R4-config (CLAUDE.md, local hooks...), R5-major-dep, R6-sensitive,
                               # P-pattern (database rules and R4-pipeline, the guard core, always block)
  report_only_paths: []        # globs like `paths` whose match is listed but never blocking (a path in both lists blocks)

review:
  # Reviews use codex_model and effort as committed on the default branch: a higher effort in your working copy applies at once; a lower effort or another codex_model
  # applies once it is on the default branch and this branch includes it. codex_model is a model id (letters, digits, . _ -).
  codex_model: gpt-6-astra
  effort: {low: medium, medium: medium, high: high, followup: medium, small_fix: low, small_fix_lines: 40}
                                # low/medium/high: round 1 by the PR's risk; followup: later rounds. small_fix: the effort of a fix-check round whose reviewed
                                # range is at most small_fix_lines changed lines, adds no new file and touches no sensitive path (also every non-protected round
                                # while the weekly Codex governor is soft). `pipeline codex-review` refuses an --effort that is not the configured one for the round
  codex_round_budget: 6         # Codex runs (rounds + second reviews recorded in the state) per PR; past it a small fix-check goes to the substitute, never to more Codex
  codex_budget: {soft: 75, hard: 90}   # weekly Codex quota used (P codex-status): soft = every non-protected round at small_fix effort; hard = small fix-checks go to the substitute. Unreadable = off
  max_rounds: 2                 # plus one confirm round when the last round only accepted fixes; base-only rounds (main merged in) don't count
  light_lane_max_lines: 50
  # size_only_medium_reviewer: judge   # judge (default) | fable. Who follows Codex on a PR that is medium ONLY for its size (no hard-stop hit of any kind, no
  #                              # sensitive path, base = the default branch): the Sonnet judge, or fable to keep the Fable pass for every medium PR.
  arbiter_always_paths: []      # globs: a PR touching one gets the Fable review pass every round, even at low risk
  docs_exempt_paths: []         # EXACT paths (no globs) of ordinary documents (markdown anywhere, docs/ text, LICENSE/CHANGELOG): lines ADDED to them after the last review round
                                # need no new round (review-complete and the final gate agree). Never an agent instruction file (CLAUDE / AGENTS / AGENT / GEMINI .md and their .<variant>.md forms), html, mdx or source, nothing in a dot-directory or app/ pages/, nothing
                                # a hard-stop path rule, integrity.test_globs, hard_stops.paths, arbiter_always_paths or risk.high_risk_paths covers, nothing under supabase/ or
                                # migrations/. Read from the config at the reviewed head, so the commit that adds a path cannot use it. Empty = off. The vendored CI runner
                                # validates this key: run `pipeline vendor` first, or it rejects the unknown key
  substitute:                   # the stand-in reviewer (Claude Opus, Fable for a high-risk PR) for a round Codex refuses because its quota is spent
    mode: auto                  #   auto = use it (the owner's own "merge" is then required); off = park the PR until Codex is back
    min_wait_minutes: 0         #   0 = never wait for Codex; N > 0 = when Codex says it is back within N minutes, wait for it instead
    max_packet_mb: 8            #   the evidence a substitute needs (rules files, the patch) may not pass this size, else the round parks
                                # The three knobs above, small_fix_lines, codex_round_budget and codex_budget are also read as committed at the default branch's fork point,
                                # and the STRICTER of the two wins (lower small_fix_lines / max_packet_mb, higher budgets / min_wait_minutes, mode off if either says off), so a PR
                                # cannot loosen its own routing. A fork-point config that cannot be read counts as mode off.

agent_log: docs/agent-log.md   # one line per run; kept on the orphan branch `pipeline-agent-log` (`pipeline agent-log publish`), never committed to a PR branch
