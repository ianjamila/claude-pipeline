# Full verify in CI on every ready PR (for repos where Actions minutes are not a constraint).
#
# Draft PRs are skipped: the job's `if:` below swallows `opened` and every push to a draft, and `ready_for_review` is in the
# trigger list (it is not in GitHub's default types), so the first run happens when the PR is marked ready and again on every
# push after that. `converted_to_draft` is listed too: it shares the PR's concurrency group, so turning a PR back into a draft
# (`pipeline redraft`, with ci.draft_while_iterating: true) cancels a running verify, and its own run skips because the PR is
# a draft by then.
name: Verify
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Reads the workflow files as data: a PR that adds a context GitHub rejects at that key fails here, not after merge.
      - run: node scripts/pipeline/workflow-contexts.mjs
      - run: node scripts/verify.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-report
          path: .verify/
          if-no-files-found: ignore
