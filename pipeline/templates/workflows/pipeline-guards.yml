# Pipeline guards — tamper-proof "Test integrity" and "Hard-stop scan" required checks.
#
# Why pull_request_target: the workflow file, the guard scripts (scripts/pipeline/) and
# .claude/pipeline.yml all come from the BASE branch, so a pull request cannot change how it is
# judged. The PR's code is fetched as git data and diffed — it is never checked out or executed.
# Results are published as commit statuses on the PR head SHA (what branch protection requires).
#
# Provenance: pull_request_target reads THIS file from the PR's base branch, so a PR into a branch whose copy of the file was
# edited would also post statuses as github-actions[bot]. Receipts and the final gate therefore verify that a status's
# target_url is a first-attempt run of this workflow, event pull_request_target, from a commit on the default branch
# (scripts/pipeline/lib/guard-provenance.mjs). There is deliberately no `branches:` filter: a template cannot know the
# default branch, and a filter in this file protects nothing against a PR into a branch that carries its own copy.
#
# Verdict artifact: a spoofing run could still point its status at a genuine run of the same PR and head that is in progress.
# So the job is split: "Evaluate" records the verdict (verdict.json) and names it, "Upload verdict" attaches it to THIS run as
# the artifact pipeline-verdict_v1_<head>_<integrity>_<hardstops>[_<label>_<login>], and only then "Publish" posts the
# statuses. A status counts only if the artifact of the run it points at says the same; a spoofing run cannot upload an
# artifact to somebody else's run. Do not rename the artifact or the steps without changing guard-provenance.mjs.
#
# Approvals: a `labeled` run by an allowed approver first posts a receipt status (`pipeline-approval: <label>`) on the
# exact head sha; an approval label only counts for a head that carries a fresh receipt from github-actions[bot], so an
# approval can never carry over to a later commit. The label name and the sender reach the job only through env:.
#
# Do not add steps that run code from the PR (npm install, its scripts, its actions).
name: Pipeline guards

on:
  pull_request_target:
    # edited: a PR retargeted with `gh pr edit --base` must be judged against its NEW base, or its old statuses stay green.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]

permissions:
  contents: read        # read base + fetch the PR head as data
  pull-requests: write  # only to remove an approval label that has no receipt for the current head
  issues: read          # label timeline (who approved, when)
  statuses: write       # publish the two required statuses and the approval receipts
  actions: read         # provenance: read workflow runs (actions/runs/{id}) and their artifacts with GITHUB_TOKEN; private repos need it

concurrency:
  # An edit that does not change the base (title, body) is a no-op below; it gets its own group so it can never cancel a
  # real evaluation that is still running for the same PR.
  group: pipeline-guards-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.base && '-noop' || '' }}
  cancel-in-progress: true

jobs:
  guards:
    name: pipeline-guards
    # `edited` also fires for title/body edits: only a base-branch change needs a new verdict.
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER_TYPE: ${{ github.event.repository.owner.type }}   # User | Organization: who may approve (ci.approvers)
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # The labeling event, for the approval receipt (empty for other events). Read only by ci-guards-run.mjs.
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_LABEL: ${{ github.event.label.name }}
      EVENT_SENDER: ${{ github.event.sender.login }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark pending
        run: |
          for ctx in "Test integrity" "Hard-stop scan"; do
            gh api "repos/$REPO/statuses/$EVENT_HEAD" -f state=pending -f context="$ctx" \
              -f description="evaluating" -f target_url="$RUN_URL" > /dev/null
          done

      # Check out github.sha — for pull_request_target the tip of the PR's base branch, the very commit THIS file was read
      # from — not pull_request.base.sha. GitHub refreshes base.sha lazily: a PR opened before the guards landed kept a
      # base without scripts/pipeline/, so every run died with "Cannot find module ci-guards-run.mjs" (EagleWatch, the day
      # the guards merged). The diff still starts at BASE_SHA, which the full-history checkout contains.
      - name: Check out base branch (trusted code only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Needed to fetch refs/pull/N/head below. Safe: no PR code ever runs in this job.
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Phase 1: judge, post the approval receipt if this is an approver's labeling, write the verdict. No final statuses yet.
      - name: Evaluate
        id: evaluate
        run: node scripts/pipeline/ci-guards-run.mjs

      # The verdict only this run can attach to itself. Its name (the step output) carries the head, both states and the receipt.
      # No output (superseded by a newer commit) means nothing to upload and nothing to publish.
      - name: Upload verdict
        if: steps.evaluate.outputs.artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.evaluate.outputs.artifact }}
          path: ${{ runner.temp }}/pipeline-verdict/verdict.json
          retention-days: 90
          if-no-files-found: error
          overwrite: false

      # Phase 2: post the two statuses (unless the head moved meanwhile), then remove approval labels that did not count.
      - name: Publish
        if: steps.evaluate.outputs.artifact != ''
        run: node scripts/pipeline/ci-guards-run.mjs --publish

      - name: Fail closed if evaluation did not finish
        if: failure() || cancelled()
        run: |
          for ctx in "Test integrity" "Hard-stop scan"; do
            cur=$(gh api "repos/$REPO/commits/$EVENT_HEAD/statuses" \
              --jq "[.[] | select(.context == \"$ctx\")][0].state" 2>/dev/null || true)
            if [ -z "$cur" ] || [ "$cur" = "pending" ]; then
              gh api "repos/$REPO/statuses/$EVENT_HEAD" -f state=error -f context="$ctx" \
                -f description="guard did not finish — push a commit, or close and reopen the PR, to run it again" \
                -f target_url="$RUN_URL" > /dev/null || true
            fi
          done
