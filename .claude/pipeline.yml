# .claude/pipeline.yml — claude-pipeline onboarded to itself.
# Every path is a hard-stop (hard_stops.paths: ["**"]): a change to the pipeline's own rules never
# auto-merges. The review skill still builds, verifies and runs the review loop, then stops before the merge and
# merges only when the owner says "merge" in chat for that exact head (owner_approval: chat).
# Validate with: node pipeline/bin/pipeline.mjs config
version: 1
project: claude-pipeline
default_branch: main
enforcement: github
worktree_dir: .worktrees
worktrees:
  mode: on                     # owner 2026-11-11: `pipeline worktrees prune` removes a finished worktree (PR merged >= 24 h, idle >= 24 h,
                               # nothing only-here, no open session) on its daily schedule, so a removal never waits on a session's cron.
owner_approval: chat          # owner rule 2026-10-12: no approval labels (as in eaglewatch). Hard-stop hits become owner-merge
                               # items; the review skill stops before EVERY merge and merges when the owner says "merge" for that head.

verify:
  full: node scripts/verify.mjs
  quick: node scripts/verify.mjs --quick
  report: .verify/report.json
  screenshots: .verify/screenshots
  expected_steps: [tests]
  # The gate may take GitHub's "test (ubuntu)" run on the exact head as proof for `tests` instead of a full local run, so a
  # busy Mac (several sessions' suites at once) no longer blocks a merge. A PR that touches the CI setup, this file or the
  # verify scripts still runs the tests on the Mac. "test (windows)" stays a required check of its own.
  deferrable_steps: [tests]
  ci_proof:
    tests: { workflow: .github/workflows/ci.yml, job: "test (ubuntu)", event: pull_request }
  ci_proof_wait_minutes: 45      # ubuntu job ~25-33 min (two Node passes) + queue, = the job timeout; past this the Mac runs the tests

ci:
  required_checks: ["test (ubuntu)", "test (windows)"]
  guard_checks: false          # no pipeline-guards.yml here: every path is a hard-stop; the owner's chat "merge" is the approval
  e2e_label: null
  draft_while_iterating: true  # ci.yml skips drafts (both required checks read skipped) and lists ready_for_review + converted_to_draft

merge:
  command: gh pr merge {pr} --squash --auto --delete-branch --match-head-commit {sha}
  wait_minutes: 15

preview: null
production: null

smoke_checks: []

risk:
  # Plan 2026-11-12-cp-risk-rating R3-6: the files that decide what is safe (guards, hard stops, the final gate, the installer,
  # the risk rating and config itself, the review/merge commands, triage, owner grants, review proof, model floor) plus
  # anything that runs code on install or commit (package.json scripts, git hooks, the install wrappers), plus the glob/git/diff/
  # doc-path helpers the rating and the final gate read (every file risk.mjs imports, a test checks the closure), plus the gate and
  # review-proof inputs: a named set, listed BY HAND (nothing here is covered automatically): transcript, CI proof, integrity, guard
  # provenance, state, review publish/context, locks, round status, the final-gate, triage and model-proof commands, the CLI entry, the
  # libs finalgate.mjs imports directly (a test checks those), the GitHub, Codex, fix-verify, hold, CLI and lease-wiring helpers the
  # review commands run on, and the commands that read or write a gate input or proof (state, model-floor, verify, ci-wait, plus the
  # risk, hardstops, integrity and preflight wrappers, and the owner-only, command-guard and ci-wait libs they use), plus the claude-
  # ancestry and branch-protection libs, the comment command, and the update command and its schedule lib (the set also covers the
  # owner-only guards: update and the model-floor reset). Only the import
  # closure of risk.mjs is checked in full (issue #356, owner chose the named set 2026-11-13). A PR touching one stays high and gets
  # Fable. A NEW file in pipeline/commands/ or a NEW import deeper than finalgate.mjs's own is NOT covered automatically (the CLI entry
  # loads commands by name, so no import reaches them): add it here by hand when it decides a gate or a proof.
  high_risk_paths: [
    "pipeline/hooks/**", "pipeline/lib/hardstops.mjs", "pipeline/lib/finalgate.mjs", "install.mjs", "pipeline/lib/installer.mjs",
    "pipeline/lib/risk.mjs", "pipeline/lib/config.mjs", "pipeline/commands/codex-review.mjs", "pipeline/commands/review-complete.mjs",
    "pipeline/commands/arbiter.mjs", "pipeline/commands/merge.mjs", "pipeline/lib/triage.mjs", "pipeline/lib/owner-grants.mjs",
    "pipeline/lib/review-marker.mjs", "pipeline/lib/floor-proof.mjs", "pipeline/lib/model-floor.mjs", "package.json",
    "**/.githooks/**", "**/.husky/**",
    "pipeline/lib/glob.mjs", "pipeline/lib/git.mjs", "pipeline/lib/diff.mjs", "pipeline/lib/doc-paths.mjs", "pipeline/lib/docs-exempt.mjs",
    "pipeline/lib/yaml.mjs", "pipeline/vendor/**", "pipeline/lib/proc.mjs", "pipeline/lib/paths.mjs", "pipeline/lib/resolution.mjs",
    "pipeline/lib/seams.mjs", "pipeline/lib/shell-words.mjs",
    "pipeline/lib/transcript.mjs", "pipeline/lib/ci-proof.mjs", "pipeline/lib/integrity.mjs", "pipeline/lib/guard-provenance.mjs",
    "pipeline/lib/state.mjs", "pipeline/lib/review-publish.mjs", "pipeline/lib/review-context.mjs", "pipeline/lib/locks.mjs",
    "pipeline/lib/round-status.mjs", "pipeline/commands/final-gate.mjs", "pipeline/commands/triage.mjs", "pipeline/commands/model-proof.mjs",
    "pipeline/bin/pipeline.mjs",
    "pipeline/lib/closing-keywords.mjs", "pipeline/lib/preflight.mjs", "pipeline/lib/verify-steps.mjs", "pipeline/lib/merge-queue.mjs",
    "pipeline/lib/github.mjs", "pipeline/lib/codex.mjs", "pipeline/lib/codex-exec.mjs", "pipeline/lib/fix-verify.mjs",
    "pipeline/lib/hold.mjs", "pipeline/lib/merge-hold.mjs", "pipeline/lib/cli.mjs", "pipeline/lib/cmd-common.mjs",
    "pipeline/lib/review-lease-wiring.mjs",
    "pipeline/commands/state.mjs", "pipeline/commands/model-floor.mjs", "pipeline/lib/owner-only.mjs", "pipeline/commands/verify.mjs",
    "pipeline/lib/command-guard.mjs", "pipeline/commands/ci-wait.mjs", "pipeline/lib/ci-wait.mjs",
    "pipeline/commands/risk.mjs", "pipeline/commands/hardstops.mjs", "pipeline/commands/integrity.mjs", "pipeline/commands/preflight.mjs",
    "pipeline/lib/claude-ancestry.mjs", "pipeline/lib/protection.mjs", "pipeline/commands/comment.mjs", "pipeline/commands/update.mjs",
    "pipeline/lib/update-schedule.mjs",
    "install.sh", "install.ps1"]
  # Every path here is a hard stop (hard_stops.paths ["**"]), so every PR would rate high. These two rules no longer raise the
  # LEVEL (round-1 Codex effort, judge vs Fable); their hits still make the merge an owner item. Editing this file or other
  # pipeline config is an R4-pipeline hit, which is not ignorable, so it stays high (R4-config hits stop raising the level only
  # once this list is on the base branch).
  ignore_hard_stop_rules: [P-path, R4-config]

hard_stops:
  paths: ["**"]

review:
  codex_model: gpt-6-astra
  max_rounds: 3

agent_log: docs/agent-log.md
