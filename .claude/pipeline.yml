# .claude/pipeline.yml — claude-pipeline onboarded to itself.
# Every path is a hard-stop (hard_stops.paths: ["**"]): a change to the pipeline's own rules never
# auto-merges. ship still builds, verifies and runs the review loop, then stops before the merge and
# merges only when the owner says "merge" in chat for that exact head (owner_approval: chat).
# Validate with: node pipeline/bin/pipeline.mjs config
version: 1
project: claude-pipeline
default_branch: main
enforcement: github
worktree_dir: .worktrees
owner_approval: chat           # owner rule 2026-10-12: no approval labels (as in eaglewatch). Hard-stop hits become owner-merge
                               # items; ship stops before EVERY merge and merges when the owner says "merge" for that head.

verify:
  full: node scripts/verify.mjs
  quick: node scripts/verify.mjs --quick
  report: .verify/report.json
  screenshots: .verify/screenshots
  expected_steps: [tests]

ci:
  required_checks: ["test (ubuntu)", "test (windows)"]
  guard_checks: false          # no pipeline-guards.yml here: every path is a hard-stop; the owner's chat "merge" is the approval
  e2e_label: null
  draft_while_iterating: false

merge:
  command: gh pr merge {pr} --squash --auto --delete-branch --match-head-commit {sha}
  wait_minutes: 15

preview: null
production: null

smoke_checks: []

risk:
  high_risk_paths: ["pipeline/hooks/**", "pipeline/lib/hardstops.mjs", "pipeline/lib/finalgate.mjs", "install.mjs", "pipeline/lib/installer.mjs"]

hard_stops:
  paths: ["**"]

review:
  codex_model: gpt-6-astra
  max_rounds: 3

agent_log: docs/agent-log.md
